name: Build Sol Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build, Lint, Evaluation & Test Sol APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Accept Android SDK Licenses & Install SDK 36 / 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDK_MANAGER="$(command -v sdkmanager || find "${SDK_ROOT}" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "${SDK_MANAGER}" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi
          echo "Using sdkmanager: ${SDK_MANAGER}"
          (yes || true) | "${SDK_MANAGER}" --licenses >/dev/null
          "${SDK_MANAGER}" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "${SDK_MANAGER}" --install "platforms;android-36.1" || true

      - name: Set up Gradle Wrapper & Cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Prepare Deterministic Debug Keystore & Env
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          ./gradlew --version
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 repository secret."
          elif [ -s debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64."
          elif [ -s debug.keystore ]; then
            echo "Using existing debug.keystore."
          else
            echo "::warning::Neither DEBUG_KEYSTORE_BASE64 secret nor debug.keystore.base64 was found; generating a CI debug.keystore."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env

      - name: Run Detekt, Android Lint, Unit & Golden Evaluation Tests + JaCoCo
        run: |
          ./gradlew :app:detekt :app:lintDebug :app:testDebugUnitTest :app:jacocoTestReport \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Print JaCoCo Coverage Summary
        if: always()
        run: |
          JACOCO_XML="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          if [ -f "${JACOCO_XML}" ]; then
            python3 -c '
          import xml.etree.ElementTree as ET
          root = ET.parse("app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml").getroot()
          print("=== JaCoCo Coverage Summary (app/debugUnitTest) ===")
          for c in root.findall("counter"):
              ctype = c.attrib["type"]
              missed = int(c.attrib["missed"])
              covered = int(c.attrib["covered"])
              total = missed + covered
              pct = (100.0 * covered / total) if total else 0.0
              print(f"{ctype:12s}: {covered}/{total} ({pct:.2f}%)")
          '
          else
            echo "JaCoCo XML report not found."
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Derive Version & Package APKs + SHA256SUMS
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "${VERSION_NAME}" ]; then
            echo "::error::Could not parse versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "Derived VERSION_NAME=${VERSION_NAME}"
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk "release-apks/Sol-v${VERSION_NAME}-debug.apk"

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${STORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n' | base64 -d > "${KEYSTORE_PATH}"
            ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
              -Dorg.gradle.workers.max=2
            cp app/build/outputs/apk/release/app-release.apk "release-apks/Sol-v${VERSION_NAME}-release.apk"
            rm -f "${KEYSTORE_PATH}"
          else
            echo "Release signing secrets not set; skipping signed release APK."
          fi

          (cd release-apks && sha256sum *.apk > SHA256SUMS)
          cat release-apks/SHA256SUMS
          ls -lh release-apks/

      - name: Upload Sol APKs & Checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sol-Android-APK
          path: |
            release-apks/*.apk
            release-apks/SHA256SUMS
          if-no-files-found: error

      - name: Upload Test, Lint, Detekt & JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sol-Verification-Reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/
            app/build/reports/jacoco/
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Sol APK & Checksum Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Sol-Android-APK
          path: release-apks

      - name: Publish Release Files
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS
